name: plugin-ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint (F, E722 — config in pyproject.toml)
        run: ruff check viva_superpowers/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install plugin (frozen — from uv.lock)
        # Install from the committed lockfile, NOT a live re-resolve. The four
        # first-party deps are git `branch=main` sources (discovery-engine,
        # viva-workspace, viva-basic-processes, investigation-contracts); a plain
        # `uv pip install -e .` resolves them to each branch tip at install time,
        # so an unrelated upstream merge silently breaks this repo's CI on the next
        # push. `uv sync --frozen` pins them to uv.lock instead, so main stays green
        # against the engine it was tested with, and the ONLY place a new engine is
        # exercised is the intentional lock-bump PR (Renovate's weekly
        # lockFileMaintenance, or a manual `uv lock --upgrade-package …`). That is
        # the consumption half of the "decoupled but in sync" seam (#391 added the
        # propagation half). See docs/specs for the cross-repo version-coordination design.
        run: uv sync --frozen --extra dev --extra evaluator --extra processes --extra events
      - name: Run L1 tests
        env:
          # The integration tests skip cleanly when ~/code/pbg-template isn't
          # present, but in CI we want to actually run them. Clone the template
          # to the expected path before pytest collects.
          #
          # Cross-repo drift guard: the golden scaffold snapshot mirrors
          # pbg-template's tree, so an *unrelated* push to pbg-template@main
          # used to silently redden pbg-superpowers@main. We instead pin the
          # exact pbg-template commit the manifest was generated against,
          # recorded in tests/fixtures/workspace-baseline/PBG_TEMPLATE_REF.
          # Bumping the template is now an intentional PR here that updates the
          # pin AND regenerates MANIFEST.txt together.
          PBG_TEMPLATE_REPO: https://github.com/vivarium-collective/pbg-template.git
        run: |
          mkdir -p ~/code
          PBG_TEMPLATE_REF="$(cat tests/fixtures/workspace-baseline/PBG_TEMPLATE_REF)"
          if [ ! -d ~/code/pbg-template ]; then
            git clone "$PBG_TEMPLATE_REPO" ~/code/pbg-template
          fi
          git -C ~/code/pbg-template fetch --depth 1 origin "$PBG_TEMPLATE_REF"
          git -C ~/code/pbg-template checkout --detach "$PBG_TEMPLATE_REF"
          echo "pinned pbg-template @ $(git -C ~/code/pbg-template rev-parse HEAD)"
          source .venv/bin/activate
          pytest -v
