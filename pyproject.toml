[project]
name = "viva-superpowers"
version = "0.23.0"
description = "Plugin Python helpers for the viva-superpowers skills (was pbg-superpowers)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "click>=8.1",
    "bigraph-schema>=0.0.60",
    "process-bigraph>=1.8.2",
    "pypdf>=4.0",
    # Shared source of truth for workspace-layout logic (WorkspacePaths, the
    # layout map, find_workspace_root, study_dir, canonical-run outcome
    # selection, package naming). Replaces the hand-vendored
    # workspace_paths.py copy + the duplicated canonical_outcomes bodies.
    "viva-workspace",
    # Default framework emitters available in every workspace. Base install is
    # lightweight (SQLiteEmitter, stdlib); heavy backends stay extras-gated via
    # viva-emitters[parquet] / [xarray] (see the `evaluator` extra). This is the
    # renamed package (was pbg-emitters); >=0.2.3 ships the `pbg_emitters`
    # back-compat import shim, so the `from pbg_emitters import ...` call sites in
    # study_evaluator / study_outcomes keep working during the deprecation window.
    "viva-emitters>=0.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.1"]
evaluator = ["viva-emitters[parquet]"]
# Default framework processes (Clock, Intervention, MathExpression).
# Auto-register into the core registry via bigraph-schema package discovery.
# Listed as optional until pbg-basic-processes is published to PyPI; local dev
# installs resolve it via [tool.uv.sources] below.
processes = ["pbg-basic-processes"]
# Agentic-spine event reactor (event_client.py / RFC-0002 Phase A). Used only by
# the optional EventClient; gated as an extra because investigation-contracts is
# a first-party git dependency not published to PyPI. Local dev installs resolve
# it via [tool.uv.sources] below.
events = ["investigation-contracts"]

[tool.uv.sources]
viva-workspace = { git = "https://github.com/vivarium-collective/viva-workspace.git", branch = "main" }
# viva-emitters needs no source override — it resolves from PyPI (>=0.2.3).
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }
investigation-contracts = { git = "https://github.com/vivarium-collective/investigation-contracts.git", branch = "main" }

[project.scripts]
# viva-* CLI entry points (pbg→viva rebrand complete; the pbg-* aliases were dropped).
viva-scaffold = "viva_superpowers.scaffold:cli"
viva-feedback-import = "viva_superpowers.feedback_import:cli"
viva-migrate-nested = "viva_superpowers.migrate_nested:main"
viva-migrate-inputs = "viva_superpowers.migrate_inputs:main"
viva-backfill-runs = "viva_superpowers.backfill_runs:main"
viva-compute-outcomes = "viva_superpowers.study_evaluator:compute_outcomes_cli"
# Agent/CI-facing: run a study's Tests, print a pytest-style summary, exit 0/1
# on the severity gate. Reads the shipped test_report/v1 (viz/tests/report.json).
viva-test = "viva_superpowers.test_cli:main"
viva-sync-runs = "viva_superpowers.study_outcomes:main"
# viva-citation-gaps removed: the citation-gap compute moved to the workbench
# server (`GET /api/citation-gaps`); there is no `viva_superpowers.citation_gaps`
# module, so the old entry point installed a script that tracebacked on invocation.
viva-canonicalize-studies = "viva_superpowers.study_canonicalize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `viva_superpowers` is the real package; `pbg_superpowers` is a back-compat
# IMPORT shim (renamed 2026 — pbg→viva). Both ship so existing
# `import pbg_superpowers` keeps working during the deprecation window. The dist
# NAME is now `viva-superpowers`; a separate `pbg-superpowers` DIST shim (see
# shim/) depends on this one so existing `pbg-superpowers` PyPI deps keep
# resolving to the renamed package.
packages = ["viva_superpowers", "pbg_superpowers"]
# templates/ lives outside the package but is required at runtime (report
# renderer, scaffold helper). Force-include it in the wheel so non-editable
# installs still work.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "viva_superpowers/_templates"

[tool.ruff]
# Minimal lint gate for the viva_superpowers package: pyflakes (F) catches
# unused imports / undefined names / f-strings-without-placeholders, and E722
# bans bare `except:`. Kept deliberately narrow so the gate stays actionable.
[tool.ruff.lint]
select = ["F", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
